org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true

# Crashlytics (release builds)
# If the build machine has restricted/blocked network access, the mapping upload task can fail with:
#   :app:uploadCrashlyticsMappingFileRelease -> java.net.SocketException: Permission denied: connect
# Disabling mapping uploads keeps the build fully local.
firebaseCrashlytics.mappingFileUploadEnabled=false

# If you build with NDK/CMake, Crashlytics can also attempt to upload native symbols.
# Disable for fully-offline/restricted-network release builds.
firebaseCrashlytics.nativeSymbolUploadEnabled=false

